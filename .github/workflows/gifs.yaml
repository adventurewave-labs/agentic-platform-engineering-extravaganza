# Render the demo GIFs from the committed asciinema casts.
#
# The casts in recordings/ are the source of truth: plain JSON-lines text,
# diffable, and produced by capturing real runs. The GIFs are a derived
# artefact, so this renders them with the pinned `agg` and commits the result
# whenever a cast changes or someone asks for it.
#
# Practical reason this exists: GIFs are the one thing in this repository that
# cannot travel over a text-only transport, so having CI able to reconstruct
# them from text keeps the repo self-healing.

name: gifs

on:
  push:
    paths:
      - "recordings/**"
      - ".github/workflows/gifs.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gifs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned renderer
        run: |
          AGG_VERSION=1.5.0
          mkdir -p bin
          curl -fsSL -o bin/agg \
            "https://github.com/asciinema/agg/releases/download/v${AGG_VERSION}/agg-x86_64-unknown-linux-gnu"
          chmod +x bin/agg
          bin/agg --version
          sudo apt-get update -qq && sudo apt-get install -y -qq gifsicle fonts-jetbrains-mono

      - name: Render every cast
        run: |
          set -euo pipefail
          mkdir -p gifs
          theme="1a1b26,c0caf5,15161e,f7768e,9ece6a,e0af68,7aa2f7,bb9af7,7dcfff,a9b1d6,414868,f7768e,9ece6a,e0af68,7aa2f7,bb9af7,7dcfff,c0caf5"
          render() {  # name font speed line-height
            echo "rendering $1.gif"
            bin/agg "recordings/$1.cast" "gifs/$1.gif" \
              --font-family "JetBrains Mono,DejaVu Sans Mono,Liberation Mono,monospace" \
              --theme "$theme" --font-size "$2" --speed "$3" \
              --line-height "$4" --idle-time-limit 1.5 --last-frame-duration 5
            gifsicle -O3 --lossy=70 --colors 128 "gifs/$1.gif" -o "gifs/$1.opt.gif" \
              && mv "gifs/$1.opt.gif" "gifs/$1.gif"
          }
          render highlight   14 1.7 1.3
          render wow         11 2.6 1.2
          render policy_gate 15 1.0 1.35
          render authz       15 1.0 1.35
          render render      15 1.0 1.35
          render drift       15 1.0 1.35
          ls -lh gifs/

      - name: Commit the rendered GIFs
        run: |
          if git diff --quiet -- gifs/; then
            echo "gifs are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gifs/
          git commit -m "chore(gifs): render from the committed casts" \
                     -m "Derived artefact, rebuilt from recordings/. The casts are the source of truth; these are just pixels."
          git push
