# Render the demo GIFs from the committed asciinema casts.
#
# The casts in recordings/ are the source of truth: plain JSON-lines text,
# diffable, and genuine PTY captures of real runs -- wall-clock timings, a real
# shell prompt, nothing re-enacted. The GIFs are a derived artefact, so this
# renders them with the pinned `agg` and commits the result whenever a cast
# changes or someone asks for it.
#
# Practical reason this exists: GIFs are the one thing in this repository that
# cannot travel over a text-only transport, so having CI able to reconstruct
# them from text keeps the repo self-healing.

name: gifs

on:
  push:
    paths:
      - "recordings/**"
      - ".github/workflows/gifs.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gifs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The version is read out of bin/setup.sh rather than repeated here. A
      # renderer pinned in two places is a renderer pinned in neither, and the
      # symptom would be CI silently re-rendering every GIF with a different
      # agg than the one a contributor has.
      - name: Install the pinned renderer
        run: |
          set -euo pipefail
          AGG_VERSION="$(sed -n 's/^AGG_VERSION="\(.*\)"$/\1/p' bin/setup.sh)"
          [ -n "${AGG_VERSION}" ] || { echo "::error::could not read AGG_VERSION from bin/setup.sh"; exit 1; }
          echo "pinned agg: ${AGG_VERSION}"
          mkdir -p bin
          curl -fsSL -o bin/agg \
            "https://github.com/asciinema/agg/releases/download/v${AGG_VERSION}/agg-x86_64-unknown-linux-gnu"
          chmod +x bin/agg
          bin/agg --version
          sudo apt-get update -qq && sudo apt-get install -y -qq gifsicle fonts-jetbrains-mono

      # Rendering goes through src/build_casts.py --render-only so the theme,
      # font size, playback speed and line height live in exactly one place.
      # This step does not re-record: the casts in recordings/ are the source
      # of truth, and a runner re-recording would mean the pixels no longer
      # correspond to any cast anyone can inspect.
      - name: Render every cast
        run: |
          python3 src/build_casts.py --render-only
          ls -lh gifs/

      - name: Commit the rendered GIFs
        run: |
          if git diff --quiet -- gifs/; then
            echo "gifs are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gifs/
          git commit -m "chore(gifs): render from the committed casts" \
                     -m "Derived artefact, rebuilt from recordings/. The casts are the source of truth; these are just pixels."
          git push
