# The repository holds itself to its own standard.
#
# `./run.sh verify` is what the README asks you to trust instead of the README.
# Running it anywhere except CI would make that a slightly hollow invitation,
# so it runs here on every push and pull request, on a clean checkout, with the
# pinned upstream binaries fetched from scratch.
#
# It will fail if: a policy changes and the committed run record is not
# regenerated, the golden path stops converging, the platform's rendered output
# picks up a kube-linter finding, an agent identity gains the ability to approve
# production, or the MCP server stops speaking the protocol.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, because the failure mode this catches is an upstream release
    # changing behaviour under a demo that claims to be reproducible.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install --no-cache-dir PyYAML==6.0.2

      - name: Cache the pinned upstream binaries
        uses: actions/cache@v4
        with:
          path: bin
          key: tools-${{ runner.os }}-${{ hashFiles('bin/setup.sh') }}

      # Invoked through `bash` rather than as `./bin/setup.sh` on purpose: a
      # checkout can arrive without the executable bit (a zip download, a
      # Windows clone, a file uploaded through a web UI), and CI failing for
      # that reason tells you nothing useful about the repository.
      - name: Fetch the pinned upstream binaries
        run: bash ./bin/setup.sh

      - name: Report the exact versions in play
        run: bash ./run.sh versions

      - name: Verify
        run: bash ./run.sh verify

      - name: The demo still runs end to end
        run: bash ./run.sh demo --speed 0 --no-color

      # verify-report.json carries wall-clock timings, so it is excluded here
      # on purpose: a duration is evidence, not a deterministic artefact.
      # Everything else in outputs/ must reproduce byte-for-byte.
      - name: The committed artefacts are unchanged by a fresh run
        run: |
          if ! git diff --quiet -- outputs/ ':!outputs/verify-report.json'; then
            echo "::error::outputs/ drifted. Re-run './run.sh demo' and commit the result."
            git --no-pager diff --stat -- outputs/ ':!outputs/verify-report.json'
            exit 1
          fi
          echo "outputs/ reproduced byte-for-byte"

      - name: The showcase page matches the policy bundle
        run: |
          python3 src/build_playground.py
          if ! git diff --quiet -- outputs/playground.json; then
            echo "::error::The page is stale against the policy bundle. Run 'make site-build'."
            git --no-pager diff --stat -- outputs/playground.json
            exit 1
          fi
          echo "the playground data still matches the policy bundle"

      # build_site.py refuses to render when the English in the template and the
      # English recorded in site/i18n.es.json disagree, so this step is also the
      # check that the two languages still make the same claims.
      - name: The two languages still say the same thing
        run: |
          # index.html embeds the acceptance timings, and the verify step above
          # just rewrote them with this runner's wall clock. Restore the committed
          # report first so the only thing this step can fail on is real drift.
          git checkout -- outputs/verify-report.json
          python3 src/build_site.py
          if ! git diff --quiet -- index.html; then
            echo "::error::index.html is stale against its template. Run 'make site-build'."
            git --no-pager diff --stat -- index.html
            exit 1
          fi
          echo "en + es agree, and index.html is current"
